services:
  postgres:
    image: postgres:16-alpine
    container_name: sahayak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sahayak
      POSTGRES_PASSWORD: sahayak
      POSTGRES_DB: sahayak
    ports:
      - "5433:5432"
    volumes:
      - sahayak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahayak"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  sahayak_pgdata: